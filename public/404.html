<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
    <script>
      (function () {
        const path = window.location.pathname;
        const validRoutes = [
          "/",
          "/node",
          "/praxis",
          "/product",
          "/about",
          "/resources",
          "/contact",
          "/careers",
          "/privacy",
          "/terms",
          "/gdpr",
          "/how-it-works"
        ];

        const isValidRoute = validRoutes.includes(path) || validRoutes.some((route) => path.startsWith(route + "/"));

        if (!isValidRoute && !path.includes(".")) {
          window.location.replace("/");
        }
      })();
    </script>
  </head>
  <body></body>
</html>
